name: Build and publish Docker image

# Когда запускать сборку:
# - при пуше в main/master (собирает и публикует тег ":latest" + короткий SHA коммита)
# - при пуше git-тега вида v1.2.3 (публикует ещё и семверные теги ":1.2.3", ":1.2", ":1")
# - вручную из вкладки Actions ("Run workflow")
on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
    paths:
      - "homework-app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

# Нужно для публикации в GitHub Container Registry (ghcr.io) через встроенный GITHUB_TOKEN,
# без создания дополнительных секретов/личных токенов.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Итоговый образ: ghcr.io/<владелец>/<репозиторий>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # ветка main/master -> тег "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # каждый коммит -> тег с коротким SHA, например "sha-a1b2c3d"
            type=sha,prefix=sha-,format=short
            # git-тег v1.2.3 -> образы 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: homework-app
          file: homework-app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # кэш между запусками, чтобы пересборка была быстрее
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
