# Запуск готового образа из GitHub Container Registry (без локальной сборки).
# Использование:
#   1) поправьте image ниже (владелец/репозиторий в нижнем регистре)
#   2) docker compose -f docker-compose.ghcr.yml up -d
#
# Если пакет в GHCR приватный, сначала войдите:
#   echo <ваш GitHub token с правом read:packages> | docker login ghcr.io -u <ваш GitHub логин> --password-stdin
services:
  homework-app:
    image: ghcr.io/OWNER/REPO:latest
    container_name: homework-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-something-random}"
      PARENT_USERNAME: "${PARENT_USERNAME:-parent}"
      PARENT_PASSWORD: "${PARENT_PASSWORD:-changeme}"
      PARENT_NAME: "${PARENT_NAME:-Родитель}"
      CHILDREN: '${CHILDREN:-[{"username":"child","password":"changeme","name":"Ребёнок"}]}'
    volumes:
      - homework-data:/app/data

volumes:
  homework-data:
