services:
  homework-app:
    build: .
    container_name: homework-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-something-random}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      ADMIN_NAME: "${ADMIN_NAME:-Администратор}"
    volumes:
      - homework-data:/app/data

volumes:
  homework-data:
