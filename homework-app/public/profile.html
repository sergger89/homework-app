<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Профиль</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>👤 Профиль</h1>
    <button id="backBtn">← Назад</button>
  </div>
  <div class="container" style="max-width:420px">
    <div class="task-card">
      <h3>Аватарка</h3>
      <div class="avatar-upload-wrap">
        <div id="currentAvatar"></div>
        <label class="upload-btn">
          Загрузить фото
          <input type="file" id="avatarInput" accept="image/*" />
        </label>
      </div>
      <p id="avatarResult" class="muted"></p>
    </div>

    <div class="task-card">
      <h3>Сменить пароль</h3>
      <form id="passForm" class="field-row">
        <label class="muted">Новый пароль
          <div class="password-field">
            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Показать пароль">👁️</button>
          </div>
        </label>
        <button type="submit" class="submit-btn">Сменить пароль</button>
      </form>
      <p id="passResult" class="muted"></p>
    </div>
  </div>
<script src="/js/mascot-render.js"></script>
<script src="/js/common.js"></script>
<script>
requireRole(['admin','parent','child']);

async function load() {
  const me = await api('/api/me');
  document.getElementById('backBtn').onclick = () => window.location.href = roleHome(me.user.role);
  document.getElementById('currentAvatar').innerHTML = avatarHtml(me.user.name, me.user.avatarPath, 64);
  wirePasswordToggles(document);
  window.__isChild = me.user.role === 'child';
}
load();

document.getElementById('avatarInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const resultEl = document.getElementById('avatarResult');
  const fd = new FormData();
  fd.append('avatar', file);
  try {
    await apiForm('/api/me/avatar', fd);
    resultEl.textContent = 'Аватарка обновлена!';
    resultEl.style.color = 'var(--correct)';
    if (window.__isChild) showMascotToast('Классное фото! Мне нравится 😍', 'admiration', true);
    load();
  } catch (err) {
    resultEl.textContent = 'Не удалось загрузить (проверьте формат и размер файла, до 3МБ).';
    resultEl.style.color = 'var(--wrong)';
  }
});

guardFormSubmit(document.getElementById('passForm'), async (e) => {
  const newPassword = document.getElementById('newPassword').value;
  const resultEl = document.getElementById('passResult');
  try {
    await api('/api/me/password', { method: 'POST', body: JSON.stringify({ newPassword }) });
    resultEl.textContent = 'Пароль изменён!';
    resultEl.style.color = 'var(--correct)';
    if (window.__isChild) showMascotToast('Готово! Теперь это секрет 🤫', 'joy', true);
    document.getElementById('passForm').reset();
  } catch (err) {
    resultEl.textContent = 'Не удалось сменить пароль (минимум 6 символов).';
    resultEl.style.color = 'var(--wrong)';
  }
});
</script>
</body>
</html>
