<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Задание</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1 id="title">Задание</h1>
    <span id="coinBadge" class="coin-badge" style="display:none">🪙 0</span>
    <span id="silverBadge" class="silver-badge" style="display:none">🥈 0</span>
    <button onclick="window.location.href='/child.html'">← К списку</button>
  </div>
  <div class="container">
    <div id="rewardBanner"></div>
    <div id="compactProgress" class="wizard-compact-progress" style="display:none">
      <span id="compactProgressText"></span>
      <div class="progress-bar" style="flex:1; margin:0 10px"><div id="compactProgressBar" style="width:0%"></div></div>
      <button id="openTaskListBtn" class="wizard-btn">📋 Все задания</button>
    </div>
    <div id="wizardDots" class="wizard-dots"></div>
    <div id="taskHolder">
      <div class="loading-state"><span class="spinner" aria-hidden="true"></span>Загрузка...</div>
    </div>
    <div class="wizard-nav">
      <button class="wizard-btn" id="prevBtn">← Назад</button>
      <button class="wizard-btn" id="skipBtn">Пропустить →</button>
      <button class="wizard-btn primary" id="nextBtn">Дальше →</button>
    </div>
  </div>
<script src="/js/mascot-render.js"></script>
<script src="/js/common.js"></script>
<script src="/js/scratchpad.js"></script>
<script>
requireRole('child');
const params = new URLSearchParams(window.location.search);
const assignmentId = params.get('id');
let tasks = [];
let assignmentInfo = null;
let currentIndex = 0;

async function load(keepIndex) {
  const { assignment, tasks: t } = await api(`/api/assignments/${assignmentId}`);
  assignmentInfo = assignment;
  tasks = t;
  document.getElementById('title').textContent = `${subjectLabel(assignment.subject)} — ${assignment.title}`;
  renderReward();
  refreshCoinBadge();
  if (!keepIndex) {
    // открываем первое ещё не отвеченное/не заблокированное задание, если есть
    const firstOpen = tasks.findIndex(t => !t.locked);
    currentIndex = firstOpen === -1 ? 0 : firstOpen;
  }
  renderDots();
  renderTask();
}

function refreshCoinBadge() {
  api('/api/me').then(({ user }) => {
    if (user.role !== 'child') return;
    const badge = document.getElementById('coinBadge');
    const silverBadge = document.getElementById('silverBadge');
    badge.style.display = 'inline-block';
    silverBadge.style.display = 'inline-block';
    api('/api/me/coins').then(({ balance, silverBalance }) => {
      badge.textContent = `🪙 ${balance}`;
      silverBadge.textContent = `🥈 ${silverBalance}`;
    });
  });
}

function renderReward() {
  const el = document.getElementById('rewardBanner');
  if (!assignmentInfo.reward) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="reward-banner">🎁 <span>Награда за это задание: <strong>${escapeHtml(assignmentInfo.reward)}</strong></span></div>`;
}

const DOTS_THRESHOLD = 24; // больше этого - точки превращаются в кашу, показываем компактный прогресс

function taskStatusClass(t) {
  const last = t.attempts && t.attempts.length ? t.attempts[t.attempts.length - 1] : null;
  if (last && last.isCorrect === true) return 'answered-correct';
  if (t.locked) return 'answered-wrong';
  if (last) return 'skipped';
  return '';
}

function renderDots() {
  const dotsEl = document.getElementById('wizardDots');
  const compactEl = document.getElementById('compactProgress');

  if (tasks.length > DOTS_THRESHOLD) {
    dotsEl.style.display = 'none';
    compactEl.style.display = 'flex';
    const doneCount = tasks.filter(t => t.attempts && t.attempts.length > 0).length;
    document.getElementById('compactProgressText').textContent = `Задание ${currentIndex + 1} из ${tasks.length}`;
    document.getElementById('compactProgressBar').style.width = `${Math.round(100 * doneCount / tasks.length)}%`;
    return;
  }

  dotsEl.style.display = 'flex';
  compactEl.style.display = 'none';
  dotsEl.innerHTML = tasks.map((t, i) => {
    let cls = 'wizard-dot ' + taskStatusClass(t);
    if (i === currentIndex) cls += ' current';
    return `<div class="${cls}" onclick="goTo(${i})">${i + 1}</div>`;
  }).join('');
}

document.getElementById('openTaskListBtn').onclick = openTaskListOverlay;

function openTaskListOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog-card task-list-card" role="dialog" aria-modal="true">
      <h3>Все задания (${tasks.length})</h3>
      <div class="task-list-scroll">
        ${tasks.map((t, i) => {
          const cls = taskStatusClass(t);
          const icon = cls === 'answered-correct' ? '✅' : cls === 'answered-wrong' ? '❌' : cls === 'skipped' ? '⏳' : '⬜';
          const label = (t.prompt || t.promptTemplate || '').slice(0, 60);
          return `<button type="button" class="task-list-row ${i === currentIndex ? 'current' : ''}" data-i="${i}">
            <span class="task-list-icon">${icon}</span>
            <span class="task-list-num">${i + 1}.</span>
            <span class="task-list-label">${escapeHtml(label)}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="dialog-actions">
        <button class="wizard-btn" id="closeTaskListBtn">Закрыть</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('#closeTaskListBtn').onclick = close;
  overlay.querySelectorAll('.task-list-row').forEach(btn => {
    btn.onclick = () => { close(); goTo(Number(btn.dataset.i)); };
  });
  overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  // сразу прокручиваем к текущему заданию в списке
  overlay.querySelector('.task-list-row.current')?.scrollIntoView({ block: 'center' });
}

const NAV_PHRASES = ['Погнали дальше!', 'Вперёд, ты справишься!', 'Ого, ты быстро!', 'Продолжаем!'];
function goTo(i) {
  const wasLast = currentIndex < i && i === tasks.length - 1;
  currentIndex = i;
  renderDots();
  renderTask();
  const allDone = tasks.every(t => t.locked);
  if (allDone) {
    showMascotToast('Ты прошёл(-ла) всё задание целиком! 🎉', 'fun', true);
  } else if (wasLast) {
    showMascotToast(NAV_PHRASES[Math.floor(Math.random() * NAV_PHRASES.length)], 'admiration');
  }
}

document.getElementById('prevBtn').onclick = () => { if (currentIndex > 0) goTo(currentIndex - 1); };
document.getElementById('skipBtn').onclick = () => { if (currentIndex < tasks.length - 1) goTo(currentIndex + 1); };
document.getElementById('nextBtn').onclick = () => { if (currentIndex < tasks.length - 1) goTo(currentIndex + 1); };

function updateNavButtons() {
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  const isLast = currentIndex === tasks.length - 1;
  document.getElementById('nextBtn').style.display = isLast ? 'none' : 'inline-block';
  document.getElementById('skipBtn').style.display = isLast ? 'none' : 'inline-block';
}

function renderTask() {
  updateNavButtons();
  const holder = document.getElementById('taskHolder');
  holder.innerHTML = '';
  holder.appendChild(buildTaskCard(tasks[currentIndex], currentIndex));
}

function buildTaskCard(t, idx) {
  const card = document.createElement('div');
  card.className = 'task-card';
  const attempts = t.attempts || [];
  const lastAttempt = attempts[attempts.length - 1] || null;
  const locked = !!t.locked;
  const canAnswer = !locked && (!lastAttempt || lastAttempt.isCorrect !== null || attempts.length === 0);
  // для needsManualReview заданий (isCorrect null) после одной попытки блокируем ввод, но не "locked" с ответом
  const awaitingManual = lastAttempt && lastAttempt.isCorrect === null;

  const promptText = t.type === 'cloze' ? '' : t.prompt;
  card.innerHTML = `<div class="task-prompt">${idx + 1}. ${escapeHtml(promptText)}</div>`;

  const body = document.createElement('div');
  card.appendChild(body);

  let getAnswer = () => null;
  const disabled = locked || awaitingManual;

  if (t.type === 'choice_single') {
    let selected = lastAttempt ? lastAttempt.answer : null;
    body.innerHTML = `<div class="options">${t.options.map((o, i) =>
      `<button type="button" class="option-btn" data-i="${i}">${escapeHtml(o)}</button>`).join('')}</div>`;
    const btns = [...body.querySelectorAll('.option-btn')];
    btns.forEach(b => b.onclick = () => {
      if (disabled) return;
      btns.forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selected = Number(b.dataset.i);
    });
    if (selected !== null) btns[selected]?.classList.add('selected');
    getAnswer = () => selected;
    if (locked) paintChoiceSingle(btns, t);
  }

  else if (t.type === 'choice_multiple') {
    let selected = new Set(lastAttempt ? lastAttempt.answer : []);
    body.innerHTML = `<div class="options">${t.options.map((o, i) =>
      `<button type="button" class="option-btn" data-i="${i}">${escapeHtml(o)}</button>`).join('')}</div>`;
    const btns = [...body.querySelectorAll('.option-btn')];
    btns.forEach(b => {
      if (selected.has(Number(b.dataset.i))) b.classList.add('selected');
      b.onclick = () => {
        if (disabled) return;
        const i = Number(b.dataset.i);
        if (selected.has(i)) { selected.delete(i); b.classList.remove('selected'); }
        else { selected.add(i); b.classList.add('selected'); }
      };
    });
    getAnswer = () => [...selected];
    if (locked) paintChoiceMultiple(btns, t);
  }

  else if (t.type === 'open_text') {
    body.innerHTML = `<input type="text" class="answer-input" placeholder="Введи ответ..." value="${lastAttempt ? escapeHtml(lastAttempt.answer) : ''}" ${disabled ? 'disabled' : ''}/>`;
    const input = body.querySelector('input');
    getAnswer = () => input.value;
  }

  else if (t.type === 'open_number') {
    body.innerHTML = `<input type="number" class="answer-input" placeholder="Введи число..." value="${lastAttempt ? escapeHtml(lastAttempt.answer) : ''}" ${disabled ? 'disabled' : ''}/>`;
    const input = body.querySelector('input');
    getAnswer = () => Number(input.value);
  }

  else if (t.type === 'matching') {
    const rightOptions = t.right.map((r, i) => `<option value="${i}">${escapeHtml(r)}</option>`).join('');
    body.innerHTML = t.left.map((l, i) => `
      <div class="matching-row">
        <div style="min-width:140px">${escapeHtml(l)}</div>
        <span>→</span>
        <select data-left="${i}" ${disabled ? 'disabled' : ''}>
          <option value="">— выбери —</option>
          ${rightOptions}
        </select>
      </div>
    `).join('');
    if (lastAttempt) {
      const ansMap = Object.fromEntries(lastAttempt.answer);
      body.querySelectorAll('select').forEach(sel => { sel.value = ansMap[sel.dataset.left] ?? ''; });
    }
    getAnswer = () => [...body.querySelectorAll('select')].map(sel => [Number(sel.dataset.left), Number(sel.value)]);
  }

  else if (t.type === 'cloze') {
    const savedAnswer = lastAttempt ? lastAttempt.answer : null;
    const savedLetters = Array.isArray(savedAnswer) ? savedAnswer : (savedAnswer && savedAnswer.letters) || [];
    const savedCheckWords = (savedAnswer && !Array.isArray(savedAnswer) && savedAnswer.checkWords) || [];
    let i = 0;
    const html = t.promptTemplate.replace(/___/g, () => {
      const bi = i++;
      const val = savedLetters[bi] ?? '';
      const needsCheckWord = t.blanks && t.blanks[bi] && t.blanks[bi].needsCheckWord;
      let out = `<input type="text" class="cloze-letter-input" data-b="${bi}" value="${escapeHtml(val)}" ${disabled ? 'disabled' : ''}/>`;
      if (needsCheckWord) {
        const cw = savedCheckWords[bi] ?? '';
        out += `<input type="text" class="cloze-checkword-input" data-cw="${bi}" placeholder="провер. слово" value="${escapeHtml(cw)}" ${disabled ? 'disabled' : ''}/>`;
      }
      return out;
    });
    body.innerHTML = `<div class="cloze-text">${html}</div>`;
    getAnswer = () => ({
      letters: [...body.querySelectorAll('.cloze-letter-input')].map(inp => inp.value),
      checkWords: (t.blanks || []).map((b, bi) => {
        const cwInput = body.querySelector(`.cloze-checkword-input[data-cw="${bi}"]`);
        return cwInput ? cwInput.value : '';
      }),
    });
  }

  else if (t.type === 'word_table') {
    const savedRows = lastAttempt ? lastAttempt.answer : [];
    const wrap = document.createElement('div');
    wrap.className = 'word-table-wrap';
    wrap.style.setProperty('--wt-cols', t.columns.length);

    function buildRow(values) {
      const row = document.createElement('div');
      row.className = 'word-table-row';
      t.columns.forEach((col, ci) => {
        const val = values ? (values[ci] ?? '') : '';
        let field;
        if (col.type === 'select') {
          field = document.createElement('select');
          field.innerHTML = '<option value="">—</option>' + col.options.map(o =>
            `<option value="${escapeHtml(o)}" ${o === val ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
        } else {
          field = document.createElement('input');
          field.type = 'text';
          field.value = val;
          field.placeholder = col.label;
        }
        field.className = 'word-table-field';
        field.disabled = disabled;
        field.dataset.col = ci;
        row.appendChild(field);
      });
      if (!disabled) {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'word-table-del';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label', 'Удалить строку');
        delBtn.onclick = () => row.remove();
        row.appendChild(delBtn);
      }
      return row;
    }

    const header = document.createElement('div');
    header.className = 'word-table-row word-table-header';
    header.innerHTML = t.columns.map(c => `<span>${escapeHtml(c.label)}</span>`).join('') + (disabled ? '' : '<span></span>');
    wrap.appendChild(header);

    const rowsHolder = document.createElement('div');
    rowsHolder.className = 'word-table-rows';
    (savedRows.length ? savedRows : disabled ? [] : [null]).forEach(v => rowsHolder.appendChild(buildRow(v)));
    wrap.appendChild(rowsHolder);

    if (!disabled) {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'scratch-btn-open';
      addBtn.textContent = '+ Добавить слово';
      addBtn.onclick = () => rowsHolder.appendChild(buildRow(null));
      wrap.appendChild(addBtn);
    }

    body.appendChild(wrap);
    getAnswer = () => [...rowsHolder.querySelectorAll('.word-table-row')].map(row =>
      [...row.querySelectorAll('.word-table-field')].map(f => f.value)
    ).filter(r => r.some(v => v.trim() !== ''));
  }

  else if (t.type === 'sentence_parse') {
    const roles = lastAttempt ? [...lastAttempt.answer] : t.tokens.map(() => 'none');
    const selected = new Set();
    const wrap = document.createElement('div');
    wrap.className = 'sentence-parse-wrap';

    const tokensEl = document.createElement('div');
    tokensEl.className = 'sp-tokens';
    const tokenSpans = t.tokens.map((tok, i) => {
      const span = document.createElement('span');
      span.className = 'sp-token role-' + (roles[i] || 'none');
      span.textContent = tok;
      if (!disabled) {
        span.onclick = () => {
          if (selected.has(i)) { selected.delete(i); span.classList.remove('sp-selected'); }
          else { selected.add(i); span.classList.add('sp-selected'); }
        };
      }
      tokensEl.appendChild(span);
      return span;
    });
    wrap.appendChild(tokensEl);

    if (!disabled) {
      const toolbar = document.createElement('div');
      toolbar.className = 'sp-toolbar';
      [['subject', 'Подлежащее ⎯'], ['predicate', 'Сказуемое ═'], ['attribute', 'Определение ∿'],
       ['object', 'Дополнение ┄'], ['adverbial', 'Обстоятельство ⋯'], ['none', 'Убрать разметку']].forEach(([role, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sp-role-btn sp-role-btn-' + role;
        btn.textContent = label;
        btn.onclick = () => {
          if (selected.size === 0) return;
          selected.forEach(i => {
            roles[i] = role;
            tokenSpans[i].className = 'sp-token role-' + role;
          });
          selected.clear();
        };
        toolbar.appendChild(btn);
      });
      wrap.appendChild(toolbar);
      const hint = document.createElement('div');
      hint.className = 'muted sp-hint';
      hint.textContent = 'Выдели слово(-а) (можно несколько), затем нажми нужный член предложения.';
      wrap.appendChild(hint);
    } else if (locked && t.correctRoles) {
      const revealWrap = document.createElement('div');
      revealWrap.className = 'sp-reveal';
      revealWrap.innerHTML = '<div class="muted" style="margin-bottom:6px">Правильный разбор:</div>';
      const revealTokens = document.createElement('div');
      revealTokens.className = 'sp-tokens';
      t.tokens.forEach((tok, i) => {
        const span = document.createElement('span');
        span.className = 'sp-token role-' + (t.correctRoles[i] || 'none');
        span.textContent = tok;
        revealTokens.appendChild(span);
      });
      revealWrap.appendChild(revealTokens);
      wrap.appendChild(revealWrap);
    }

    body.appendChild(wrap);
    getAnswer = () => roles;
  }

  else if (t.type === 'word_composition') {
    const letters = t.word.split('');
    const savedAnswer = lastAttempt ? lastAttempt.answer : null;
    const types = savedAnswer ? [...savedAnswer.types] : letters.map(() => 'none');
    let zeroEnding = savedAnswer ? !!savedAnswer.zeroEnding : false;
    const selected = new Set();
    const wrap = document.createElement('div');
    wrap.className = 'word-comp-wrap';

    const lettersEl = document.createElement('div');
    lettersEl.className = 'wc-letters';
    const letterSpans = letters.map((ch, i) => {
      const span = document.createElement('span');
      span.className = 'wc-letter morph-' + (types[i] || 'none');
      span.textContent = ch;
      if (!disabled) {
        span.onclick = () => {
          if (selected.has(i)) { selected.delete(i); span.classList.remove('wc-selected'); }
          else { selected.add(i); span.classList.add('wc-selected'); }
        };
      }
      lettersEl.appendChild(span);
      return span;
    });
    wrap.appendChild(lettersEl);

    const zeroBtn = document.createElement('button');
    zeroBtn.type = 'button';
    zeroBtn.className = 'wc-zero-btn' + (zeroEnding ? ' active' : '');
    zeroBtn.textContent = '□ Нулевое окончание';
    if (!disabled) {
      zeroBtn.onclick = () => { zeroEnding = !zeroEnding; zeroBtn.classList.toggle('active', zeroEnding); };
    } else {
      zeroBtn.disabled = true;
    }
    wrap.appendChild(zeroBtn);

    if (!disabled) {
      const toolbar = document.createElement('div');
      toolbar.className = 'sp-toolbar';
      [['prefix', 'Приставка'], ['root', 'Корень'], ['interfix', 'Соед. гласная'],
       ['suffix', 'Суффикс'], ['ending', 'Окончание'], ['postfix', 'Постфикс'], ['none', 'Убрать разметку']].forEach(([type, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wc-type-btn wc-type-btn-' + type;
        btn.textContent = label;
        btn.onclick = () => {
          if (selected.size === 0) return;
          selected.forEach(i => {
            types[i] = type;
            letterSpans[i].className = 'wc-letter morph-' + type;
          });
          selected.clear();
        };
        toolbar.appendChild(btn);
      });
      wrap.appendChild(toolbar);
      const hint = document.createElement('div');
      hint.className = 'muted sp-hint';
      hint.textContent = 'Выдели буквы (можно несколько), затем нажми нужную часть слова.';
      wrap.appendChild(hint);
    } else if (locked && t.correctTypes) {
      const revealWrap = document.createElement('div');
      revealWrap.className = 'sp-reveal';
      revealWrap.innerHTML = '<div class="muted" style="margin-bottom:6px">Правильный разбор:' +
        (t.hasZeroEnding ? ' (и нулевое окончание)' : '') + '</div>';
      const revealLetters = document.createElement('div');
      revealLetters.className = 'wc-letters';
      letters.forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'wc-letter morph-' + (t.correctTypes[i] || 'none');
        span.textContent = ch;
        revealLetters.appendChild(span);
      });
      revealWrap.appendChild(revealLetters);
      wrap.appendChild(revealWrap);
    }

    body.appendChild(wrap);
    getAnswer = () => ({ types, zeroEnding });
  }
  if (attempts.length > 0) {
    const info = document.createElement('div');
    info.className = 'attempts-badge';
    info.textContent = locked
      ? `Попытки исчерпаны (${attempts.length})`
      : awaitingManual
        ? 'Ответ отправлен, ждёт проверки родителем'
        : t.attemptsLeft <= 1
          ? `Попытка ${attempts.length} — это была последняя перед бонусной! Есть ещё ${t.attemptsLeft} попытка.`
          : `Попытка ${attempts.length}, осталось ещё ${t.attemptsLeft}`;
    card.appendChild(info);
  }

  // докупить +3 попытки за 1 монету - доступно, пока задание не заблокировано.
  // важно: как только текущая попытка окажется 4-й неверной - раскроется ответ и купить будет нельзя.
  if (t.canBuyAttempts) {
    const buyWrap = document.createElement('div');
    buyWrap.className = 'buy-attempts-wrap';
    buyWrap.innerHTML = `
      <button type="button" class="buy-attempts-btn">💰 Купить ещё 3 попытки за 1 монету</button>
      <div class="buy-attempts-warning">Если ответишь неверно и попытки закончатся — увидишь правильный ответ, и докупить будет уже нельзя.</div>
    `;
    const buyBtn = buyWrap.querySelector('.buy-attempts-btn');
    buyBtn.onclick = async () => {
      buyBtn.disabled = true;
      try {
        await api(`/api/tasks/${t.id}/buy-attempts`, { method: 'POST' });
        refreshCoinBadge();
        load(true);
      } catch (e) {
        if (e.data?.error === 'insufficient_funds') {
          buyWrap.querySelector('.buy-attempts-warning').textContent = 'Не хватает монет для покупки попыток.';
        }
        buyBtn.disabled = false;
      }
    };
    card.appendChild(buyWrap);
  }

  // кнопка "отправить на ручную проверку" - если ребёнок не согласен с автооценкой.
  // не показываем для заданий, которые и так уже ждут ручной проверки (needsManualReview).
  if (lastAttempt && !awaitingManual && !lastAttempt.manuallyGraded) {
    if (lastAttempt.flaggedForReview) {
      const flaggedInfo = document.createElement('div');
      flaggedInfo.className = 'flag-review-status';
      flaggedInfo.textContent = '🚩 Отправлено на проверку родителю';
      card.appendChild(flaggedInfo);
    } else {
      const flagBtn = document.createElement('button');
      flagBtn.type = 'button';
      flagBtn.className = 'flag-review-btn';
      flagBtn.textContent = '🚩 Отправить на проверку';
      flagBtn.onclick = async () => {
        flagBtn.disabled = true;
        try {
          await api(`/api/tasks/${t.id}/flag-review`, { method: 'POST' });
          load(true);
        } catch (e) {
          flagBtn.disabled = false;
        }
      };
      card.appendChild(flagBtn);
    }
  }

  // объяснение, раскрытое сервером (после 3-й ошибки или при блокировке) — показываем ПОСТОЯННО,
  // а не только сразу после отправки, иначе оно пропадает при следующей перезагрузке страницы
  if (t.explanation) {
    const ex = document.createElement('div');
    ex.className = 'explanation persistent-explanation';
    ex.textContent = (attempts.length >= 3 && !locked ? '💡 Подсказка: ' : '') + t.explanation;
    card.appendChild(ex);
  }

  // кнопка черновика — есть у всех заданий, кроме тех где отвечать больше нельзя
  const scratchBtn = document.createElement('button');
  scratchBtn.type = 'button';
  scratchBtn.className = 'scratch-btn-open';
  scratchBtn.textContent = '✏️ Черновик';
  scratchBtn.onclick = () => {
    showMascotToast('Черновик — твоё личное место, пиши смело!', 'wink');
    openScratchpad(t.id, t.prompt || t.promptTemplate || '');
  };
  card.appendChild(scratchBtn);

  if (!disabled) {
    const btn = document.createElement('button');
    btn.className = 'submit-btn';
    btn.textContent = attempts.length > 0 ? 'Попробовать ещё раз' : 'Проверить';
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await api(`/api/tasks/${t.id}/submit`, { method: 'POST', body: JSON.stringify({ answer: getAnswer() }) });
        showResult(card, res);
        setTimeout(() => load(true), 700);
      } catch (e) {
        btn.disabled = false;
      }
    };
    card.appendChild(btn);
  } else if (lastAttempt) {
    showResult(card, { isCorrect: lastAttempt.isCorrect, explanation: t.explanation });
  }

  return card;
}

function paintChoiceSingle(btns, t) {
  const lastAttempt = t.attempts[t.attempts.length - 1];
  btns.forEach(b => {
    const i = Number(b.dataset.i);
    if (i === t.correctIndex) b.classList.add('correct');
    else if (lastAttempt && i === lastAttempt.answer) b.classList.add('wrong');
  });
}
function paintChoiceMultiple(btns, t) {
  const lastAttempt = t.attempts[t.attempts.length - 1];
  const correctSet = new Set(t.correctIndices);
  const givenSet = new Set(lastAttempt ? lastAttempt.answer : []);
  btns.forEach(b => {
    const i = Number(b.dataset.i);
    if (correctSet.has(i)) b.classList.add('correct');
    else if (givenSet.has(i)) b.classList.add('wrong');
  });
}

function showResult(card, res) {
  const badge = document.createElement('div');
  if (res.isCorrect === null) {
    badge.className = 'result-badge';
    badge.style.color = 'var(--muted)';
    badge.textContent = '📝 Ответ сохранён, ждёт проверки родителем';
    showMascotToast('Жду, когда родитель проверит! Подожди немного 🙂', 'boredom', true);
  } else if (res.bonusAttemptGranted) {
    badge.className = 'result-badge wrong';
    badge.textContent = '❌ Неверно. Вот подсказка — и ещё один, последний шанс!';
    showMascotToast('Вот тебе подсказка — и ещё один шанс!', 'wink', true);
  } else {
    badge.className = 'result-badge ' + (res.isCorrect ? 'correct' : 'wrong');
    badge.textContent = res.isCorrect ? '✅ Верно!' : (res.locked ? '❌ Неверно. Попытки закончились.' : '❌ Неверно, попробуй ещё раз');
    if (res.isCorrect) {
      const phrases = ['Молодец! Точно в цель!', 'Ура, верно!', 'Отлично справился(-лась)!'];
      showMascotToast(phrases[Math.floor(Math.random() * phrases.length)], 'joy', true);
    } else if (res.locked) {
      showMascotToast('Ничего страшного, в следующий раз получится!', 'sadness', true);
    } else {
      showMascotToast('Ой! Попробуй ещё раз', 'surprise', true);
    }
  }
  card.appendChild(badge);
  // само объяснение теперь показывает постоянный блок в buildTaskCard (переживает перезагрузку) -
  // здесь его не дублируем.
  if (res.coinsEarned > 0) showCoinToast(res.coinsEarned, res.coinBalance, res.silverEarned, res.silverBalance);
}

function showCoinToast(amount, balance, silverAmount, silverBalance) {
  const toast = document.createElement('div');
  toast.className = 'coin-toast';
  toast.textContent = silverAmount > 0 ? `🪙 +${amount}  🥈 +${silverAmount}` : `🪙 +${amount}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 1800);
  const badge = document.getElementById('coinBadge');
  if (badge && balance !== undefined) badge.textContent = `🪙 ${balance}`;
  const silverBadge = document.getElementById('silverBadge');
  if (silverBadge && silverBalance !== undefined) silverBadge.textContent = `🥈 ${silverBalance}`;
}

load();
</script>
