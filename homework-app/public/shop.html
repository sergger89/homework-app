<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин наград</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>🛍️ Магазин наград</h1>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <span id="coinBadge" class="coin-badge" style="display:none">🪙 0</span>
      <button id="backBtn">← Назад</button>
    </div>
  </div>
  <div class="container">
    <select id="childSelect" class="child-select" style="display:none"></select>

    <!-- ---------- маскот (только у ребёнка) ---------- -->
    <div id="mascotWrap" class="mascot-wrap" style="display:none">
      <div id="mascotFace" class="mascot-face">🦉</div>
      <div id="mascotBubble" class="mascot-bubble"></div>
    </div>

    <div class="tabs" id="childTabs" style="display:none">
      <button id="tabShop" class="active">🛍️ Витрина</button>
      <button id="tabHistory">📦 Мои покупки</button>
    </div>

    <div id="shopGrid" class="assignment-list"></div>
    <div id="historyList" class="assignment-list" style="display:none"></div>

    <!-- ---------- управление (родитель/админ) ---------- -->
    <div id="manageBox" class="task-card" style="display:none">
      <h3>Добавить товар</h3>
      <form id="addItemForm" class="field-row" style="max-width:420px">
        <label class="muted">Иконка (эмодзи)
          <input type="text" id="itemIcon" placeholder="🎮" maxlength="4" value="🎁" />
        </label>
        <label class="muted">Название<input type="text" id="itemName" required /></label>
        <label class="muted">Описание (необязательно)<input type="text" id="itemDescription" /></label>
        <label class="muted">Цена (монет)<input type="number" id="itemCost" min="1" required /></label>
        <button type="submit" class="submit-btn">Добавить в магазин</button>
      </form>
      <p id="addItemResult" class="muted"></p>
    </div>

    <div id="fulfillBox" style="display:none">
      <h3 style="margin-top:24px">Ожидают выдачи</h3>
      <div id="fulfillList" class="assignment-list"></div>
    </div>
  </div>
<script src="/js/common.js"></script>
<script>
let myRole = null;
let myId = null;
let children = [];
let currentChildId = null;
let shopTab = 'shop';
let cachedItems = [];
let cachedPurchases = [];

async function init() {
  const me = await api('/api/me');
  myRole = me.user.role;
  myId = me.user.id;
  document.getElementById('backBtn').onclick = () => window.location.href = roleHome(myRole);

  if (myRole === 'child') {
    currentChildId = myId;
    document.getElementById('mascotWrap').style.display = 'flex';
    document.getElementById('childTabs').style.display = 'flex';
    document.getElementById('coinBadge').style.display = 'inline-block';
    document.getElementById('tabShop').onclick = () => switchShopTab('shop');
    document.getElementById('tabHistory').onclick = () => switchShopTab('history');
    mascotGreet();
  } else {
    document.getElementById('manageBox').style.display = 'block';
    document.getElementById('fulfillBox').style.display = 'block';
    const { children: c } = await api('/api/children');
    children = c;
    const sel = document.getElementById('childSelect');
    if (children.length > 0) {
      sel.style.display = 'block';
      sel.innerHTML = children.map(ch => `<option value="${ch.id}">${escapeHtml(ch.display_name)}</option>`).join('');
      currentChildId = children[0].id;
      sel.onchange = () => { currentChildId = Number(sel.value); loadFulfillList(); };
    }
  }
  await loadItems();
  if (myRole !== 'child') loadFulfillList();
}

function switchShopTab(tab) {
  shopTab = tab;
  document.getElementById('tabShop').classList.toggle('active', tab === 'shop');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('shopGrid').style.display = tab === 'shop' ? 'flex' : 'none';
  document.getElementById('historyList').style.display = tab === 'history' ? 'flex' : 'none';
  if (tab === 'history') loadHistory();
}

// ---------------- маскот ----------------
function mascotSay(message, mood) {
  const face = document.getElementById('mascotFace');
  const bubble = document.getElementById('mascotBubble');
  const moods = { happy: '🦉', excited: '🥳', sad: '😔', shrug: '🤷', neutral: '🦉' };
  face.textContent = moods[mood] || '🦉';
  bubble.textContent = message;
  face.classList.remove('bounce', 'shake');
  void face.offsetWidth; // перезапуск CSS-анимации
  face.classList.add(mood === 'sad' || mood === 'shrug' ? 'shake' : 'bounce');
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
}

async function mascotGreet() {
  const me = await api('/api/me');
  const { balance } = await api('/api/me/coins');
  document.getElementById('coinBadge').textContent = `🪙 ${balance}`;
  if (balance === 0) {
    mascotSay(`Привет, ${me.user.name}! Выполняй задания, чтобы заработать монетки 🪙`, 'neutral');
  } else {
    mascotSay(`Привет, ${me.user.name}! У тебя ${balance} монет — смотри, что можно взять!`, 'happy');
  }
}

// ---------------- витрина ----------------
async function loadItems() {
  document.getElementById('shopGrid').innerHTML = loadingHtml();
  const url = currentChildId ? `/api/shop/items?childId=${currentChildId}` : '/api/shop/items';
  const { items } = await api(url);
  cachedItems = items;
  let balance = 0;
  if (currentChildId) {
    const b = await api(`/api/me/coins${myRole !== 'child' ? '?childId=' + currentChildId : ''}`);
    balance = b.balance;
    if (myRole === 'child') document.getElementById('coinBadge').textContent = `🪙 ${balance}`;
  }
  renderShopGrid(items, balance);
}

function renderShopGrid(items, balance) {
  const el = document.getElementById('shopGrid');
  if (items.length === 0) {
    el.innerHTML = `<p class="muted">${myRole === 'child' ? 'Пока магазин пуст — спроси родителя, что туда добавить.' : 'Пока нет ни одного товара — добавьте первый ниже.'}</p>`;
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="shop-item-card">
      <div class="shop-item-icon">${item.icon || '🎁'}</div>
      <div style="flex:1">
        <strong>${escapeHtml(item.name)}</strong>
        ${item.description ? `<div class="muted">${escapeHtml(item.description)}</div>` : ''}
        <div class="shop-item-cost">🪙 ${item.cost}</div>
        ${!item.active ? '<div class="muted">(скрыт из витрины)</div>' : ''}
      </div>
      ${myRole === 'child'
        ? `<button class="submit-btn" onclick="buyItem(${item.id}, ${item.cost})" ${balance < item.cost ? 'disabled' : ''}>Купить</button>`
        : item.canManage ? `
          <div style="display:flex; flex-direction:column; gap:6px">
            <button onclick="toggleItemActive(${item.id}, ${item.active ? 0 : 1})">${item.active ? 'Скрыть' : 'Показать'}</button>
            <button onclick="deleteItem(${item.id})">Удалить</button>
          </div>` : ''}
    </div>
  `).join('');
}

async function buyItem(itemId, cost) {
  try {
    const res = await api('/api/shop/purchase', { method: 'POST', body: JSON.stringify({ itemId }) });
    document.getElementById('coinBadge').textContent = `🪙 ${res.balance}`;
    mascotSay('Ура! Забирай свою награду! Родитель скоро её выдаст 🎉', 'excited');
    loadItems();
  } catch (e) {
    if (e.data?.error === 'insufficient_funds') {
      const item = cachedItems.find(i => i.id === itemId);
      mascotSay(`Ещё маловато монеток на «${item?.name || 'это'}» — заработай ещё, выполняя задания!`, 'shrug');
    } else {
      mascotSay('Что-то пошло не так, попробуй ещё раз.', 'sad');
    }
  }
}

async function toggleItemActive(itemId, active) {
  await api(`/api/shop/items/${itemId}`, { method: 'PATCH', body: JSON.stringify({ active: !!active }) });
  loadItems();
}
async function deleteItem(itemId) {
  const ok = await showConfirmDialog('Товар пропадёт из витрины у всех детей.', { title: 'Удалить этот товар?', danger: true, confirmText: 'Удалить' });
  if (!ok) return;
  await api(`/api/shop/items/${itemId}`, { method: 'DELETE' });
  loadItems();
}

document.getElementById('addItemForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const resultEl = document.getElementById('addItemResult');
  const name = document.getElementById('itemName').value.trim();
  const description = document.getElementById('itemDescription').value.trim();
  const cost = Number(document.getElementById('itemCost').value);
  const icon = document.getElementById('itemIcon').value.trim() || '🎁';
  try {
    await api('/api/shop/items', { method: 'POST', body: JSON.stringify({ name, description, cost, icon }) });
    resultEl.textContent = 'Товар добавлен!';
    resultEl.style.color = 'var(--correct)';
    document.getElementById('addItemForm').reset();
    document.getElementById('itemIcon').value = '🎁';
    loadItems();
  } catch (e) {
    resultEl.textContent = 'Не удалось добавить (укажите название и положительную цену).';
    resultEl.style.color = 'var(--wrong)';
  }
});

// ---------------- история покупок (ребёнок) ----------------
async function loadHistory() {
  document.getElementById('historyList').innerHTML = loadingHtml();
  const { purchases } = await api('/api/shop/purchases');
  cachedPurchases = purchases;
  const el = document.getElementById('historyList');
  if (purchases.length === 0) {
    el.innerHTML = '<p class="muted">Пока нет покупок.</p>';
    return;
  }
  const pending = purchases.filter(p => p.status === 'pending').length;
  if (pending > 0) mascotSay(`Жду, когда тебе выдадут ${pending === 1 ? 'заказ' : 'заказы'} (${pending})!`, 'neutral');
  else mascotSay('Все заказы уже получены! 🎉', 'excited');

  el.innerHTML = purchases.map(p => `
    <div class="assignment-card" style="cursor:default">
      <div style="flex:1">
        <strong>${escapeHtml(p.itemName)}</strong> · 🪙 ${p.cost}
        <div class="muted">${new Date(p.createdAt + 'Z').toLocaleString('ru-RU')}</div>
      </div>
      <span class="${p.status === 'fulfilled' ? 'given' : 'muted'}">${p.status === 'fulfilled' ? '✅ Выдано' : '⏳ Ожидает выдачи'}</span>
    </div>
  `).join('');
}

// ---------------- выдача покупок (родитель/админ) ----------------
async function loadFulfillList() {
  const el = document.getElementById('fulfillList');
  el.innerHTML = loadingHtml();
  if (!currentChildId) { el.innerHTML = '<p class="muted">Сначала добавьте ребёнка.</p>'; return; }
  const { purchases } = await api(`/api/shop/purchases?childId=${currentChildId}`);
  const pending = purchases.filter(p => p.status === 'pending');
  if (pending.length === 0) { el.innerHTML = '<p class="muted">Нет покупок, ожидающих выдачи.</p>'; return; }
  el.innerHTML = pending.map(p => `
    <div class="assignment-card" style="cursor:default">
      <div style="flex:1">
        <strong>${escapeHtml(p.itemName)}</strong> · 🪙 ${p.cost}
        <div class="muted">${new Date(p.createdAt + 'Z').toLocaleString('ru-RU')}</div>
      </div>
      <button onclick="fulfillPurchase(${p.id})">Отметить выданным</button>
    </div>
  `).join('');
}

async function fulfillPurchase(purchaseId) {
  await api(`/api/shop/purchases/${purchaseId}/fulfill`, { method: 'POST' });
  loadFulfillList();
}

init();
</script>
</body>
</html>
