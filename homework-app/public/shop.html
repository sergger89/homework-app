<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин наград</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1>🛍️ Магазин наград</h1>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <span id="coinBadge" class="coin-badge" style="display:none">🪙 0</span>
      <span id="silverBadge" class="silver-badge" style="display:none">🥈 0</span>
      <button id="backBtn">← Назад</button>
    </div>
  </div>
  <div class="container">
    <select id="childSelect" class="child-select" style="display:none"></select>

    <!-- ---------- ожидающие выдачи (родитель/админ) - специально в самом начале страницы,
         чтобы не листать вниз мимо витрины/формы добавления товара ---------- -->
    <div id="fulfillBox" style="display:none">
      <h3>📦 Ожидают выдачи</h3>
      <div id="fulfillList" class="assignment-list"></div>
    </div>

    <!-- ---------- маскот + голод (только у ребёнка) ---------- -->
    <div id="mascotWrap" class="mascot-wrap" style="display:none"></div>
    <div id="hungerBarWrap" class="hunger-bar-wrap" style="display:none">
      <span class="hunger-label">🍽️ Сытость маскота</span>
      <div class="progress-bar hunger-bar"><div id="hungerBarFill" style="width:100%"></div></div>
      <span id="hungerPercentText" class="muted">100%</span>
    </div>

    <div class="tabs" id="childTabs" style="display:none">
      <button id="tabShop" class="active">🛍️ Витрина</button>
      <button id="tabFeed">🍎 Покормить</button>
      <button id="tabHistory">📦 Мои покупки</button>
    </div>

    <div id="shopGrid" class="assignment-list"></div>
    <div id="feedGrid" class="assignment-list" style="display:none"></div>
    <div id="historyList" class="assignment-list" style="display:none"></div>

    <!-- ---------- управление (родитель/админ) ---------- -->
    <div id="manageBox" class="task-card" style="display:none">
      <h3>Добавить товар</h3>
      <form id="addItemForm" class="field-row" style="max-width:420px">
        <label class="muted">Тип
          <select id="itemCurrency">
            <option value="gold">Награда (золотые монеты, нужна выдача родителем)</option>
            <option value="silver">Лакомство для маскота (серебряные монеты, выдаётся сразу)</option>
          </select>
        </label>
        <label class="muted">Иконка (эмодзи)
          <input type="text" id="itemIcon" placeholder="🎮" maxlength="4" value="🎁" />
        </label>
        <label class="muted">Название<input type="text" id="itemName" required /></label>
        <label class="muted">Описание (необязательно)<input type="text" id="itemDescription" /></label>
        <label class="muted">Цена (монет)<input type="number" id="itemCost" min="1" required /></label>
        <label class="muted" id="restoreAmountWrap" style="display:none">Восстанавливает сытости, %
          <input type="number" id="itemRestoreAmount" min="1" max="100" value="20" />
        </label>
        <button type="submit" class="submit-btn">Добавить в магазин</button>
      </form>
      <p id="addItemResult" class="muted"></p>
    </div>

    <div id="hungerSettingsBox" class="task-card" style="display:none">
      <h3>⏱️ Скорость голода маскота</h3>
      <p class="muted">За сколько часов сытость падает со 100% до 0% без кормления, для выбранного ребёнка.</p>
      <div class="field-row" style="max-width:280px; flex-direction:row; align-items:center; gap:10px">
        <input type="number" id="decayHoursInput" min="0.5" step="0.5" style="flex:1" />
        <button id="saveDecayBtn" class="submit-btn">Сохранить</button>
      </div>
      <p id="decayResult" class="muted"></p>
    </div>
  </div>
<script src="/js/mascot-render.js"></script>
<script src="/js/common.js"></script>
<script>
let myRole = null;
let myId = null;
let children = [];
let currentChildId = null;
let shopTab = 'shop';
let cachedItems = [];
let cachedPurchases = [];

let mascot = null;

async function init() {
  const me = await api('/api/me');
  myRole = me.user.role;
  myId = me.user.id;
  document.getElementById('backBtn').onclick = () => window.location.href = roleHome(myRole);

  if (myRole === 'child') {
    currentChildId = myId;
    const mascotWrap = document.getElementById('mascotWrap');
    mascotWrap.style.display = 'flex';
    mascot = createMascotWidget(mascotWrap);
    document.getElementById('hungerBarWrap').style.display = 'flex';
    document.getElementById('childTabs').style.display = 'flex';
    document.getElementById('coinBadge').style.display = 'inline-block';
    document.getElementById('silverBadge').style.display = 'inline-block';
    document.getElementById('tabShop').onclick = () => switchShopTab('shop');
    document.getElementById('tabFeed').onclick = () => switchShopTab('feed');
    document.getElementById('tabHistory').onclick = () => switchShopTab('history');
    await loadHunger();
    mascotGreet();
  } else {
    document.getElementById('manageBox').style.display = 'block';
    document.getElementById('fulfillBox').style.display = 'block';
    document.getElementById('itemCurrency').onchange = (e) => {
      document.getElementById('restoreAmountWrap').style.display = e.target.value === 'silver' ? 'block' : 'none';
    };
    document.getElementById('saveDecayBtn').onclick = saveDecaySettings;
    const { children: c } = await api('/api/children');
    children = c;
    const sel = document.getElementById('childSelect');
    if (children.length > 0) {
      sel.style.display = 'block';
      sel.innerHTML = children.map(ch => `<option value="${ch.id}">${escapeHtml(ch.display_name)}</option>`).join('');
      currentChildId = children[0].id;
      document.getElementById('hungerSettingsBox').style.display = 'block';
      loadDecaySettings();
      sel.onchange = () => { currentChildId = Number(sel.value); loadFulfillList(); loadDecaySettings(); };
    }
  }
  await loadItems();
  if (myRole !== 'child') loadFulfillList();
}

async function loadDecaySettings() {
  if (!currentChildId) return;
  const { decayHours } = await api(`/api/me/hunger?childId=${currentChildId}`);
  document.getElementById('decayHoursInput').value = decayHours;
  document.getElementById('decayResult').textContent = '';
}

const saveDecaySettings = guardClick(async function () {
  const resultEl = document.getElementById('decayResult');
  const decayHours = Number(document.getElementById('decayHoursInput').value);
  try {
    await api('/api/mascot/decay-settings', { method: 'PATCH', body: JSON.stringify({ childId: currentChildId, decayHours }) });
    resultEl.textContent = 'Сохранено!';
    resultEl.style.color = 'var(--correct)';
  } catch (e) {
    resultEl.textContent = 'Не удалось сохранить (укажите положительное число часов).';
    resultEl.style.color = 'var(--wrong)';
  }
});

function switchShopTab(tab) {
  shopTab = tab;
  document.getElementById('tabShop').classList.toggle('active', tab === 'shop');
  document.getElementById('tabFeed')?.classList.toggle('active', tab === 'feed');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('shopGrid').style.display = tab === 'shop' ? 'flex' : 'none';
  document.getElementById('feedGrid').style.display = tab === 'feed' ? 'flex' : 'none';
  document.getElementById('historyList').style.display = tab === 'history' ? 'flex' : 'none';
  if (tab === 'history') loadHistory();
  if (tab === 'feed') loadFeedGrid();
}

// ---------------- голод маскота ----------------
async function loadHunger() {
  const { hunger } = await api('/api/me/hunger');
  const pct = Math.round(hunger);
  document.getElementById('hungerBarFill').style.width = `${pct}%`;
  document.getElementById('hungerPercentText').textContent = `${pct}%`;
  return pct;
}

// ---------------- маскот ----------------
async function mascotGreet() {
  const me = await api('/api/me');
  const { balance, silverBalance } = await api('/api/me/coins');
  document.getElementById('coinBadge').textContent = `🪙 ${balance}`;
  document.getElementById('silverBadge').textContent = `🥈 ${silverBalance}`;
  const hungerPct = await loadHunger();
  if (hungerPct < 8) {
    mascot.say(`Урчит в животе так, что аж злюсь! Скорее покорми меня 😤`, hungerMood(hungerPct));
  } else if (hungerPct < 30) {
    mascot.say(`Ой, я проголодался! Загляни во вкладку «Покормить» 🍎`, hungerMood(hungerPct));
  } else if (balance === 0) {
    mascot.say(`Привет, ${me.user.name}! Выполняй задания, чтобы заработать монетки 🪙`, 'disappointment');
  } else {
    mascot.say(`Привет, ${me.user.name}! У тебя ${balance} монет — смотри, что можно взять!`, 'joy');
  }
}

// ---------------- витрина (золотые награды) ----------------
async function loadItems() {
  document.getElementById('shopGrid').innerHTML = loadingHtml();
  const url = currentChildId ? `/api/shop/items?childId=${currentChildId}` : '/api/shop/items';
  const { items } = await api(url);
  cachedItems = items;
  const goldItems = myRole === 'child' ? items.filter(i => i.currency !== 'silver') : items;
  let balance = 0;
  if (currentChildId) {
    const b = await api(`/api/me/coins${myRole !== 'child' ? '?childId=' + currentChildId : ''}`);
    balance = b.balance;
    if (myRole === 'child') document.getElementById('coinBadge').textContent = `🪙 ${balance}`;
  }
  renderShopGrid(goldItems, balance);
}

function renderShopGrid(items, balance) {
  const el = document.getElementById('shopGrid');
  if (items.length === 0) {
    el.innerHTML = `<p class="muted">${myRole === 'child' ? 'Пока магазин пуст — спроси родителя, что туда добавить.' : 'Пока нет ни одной награды — добавьте первую ниже (тип «Награда»).'}</p>`;
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="shop-item-card">
      <div class="shop-item-icon">${item.icon || '🎁'}</div>
      <div style="flex:1">
        <strong>${escapeHtml(item.name)}</strong>
        ${item.description ? `<div class="muted">${escapeHtml(item.description)}</div>` : ''}
        <div class="shop-item-cost">${item.currency === 'silver' ? '🥈' : '🪙'} ${item.cost}${item.currency === 'silver' ? ` · +${item.restoreAmount}% сытости` : ''}</div>
        ${!item.active ? '<div class="muted">(скрыт из витрины)</div>' : ''}
      </div>
      ${myRole === 'child'
        ? `<button class="submit-btn" onclick="buyItem(${item.id}, ${item.cost})" ${balance < item.cost ? 'disabled' : ''}>Купить</button>`
        : item.canManage ? `
          <div style="display:flex; flex-direction:column; gap:6px">
            <button onclick="openEditItemDialog(${item.id})">✏️ Изменить</button>
            <button onclick="toggleItemActive(${item.id}, ${item.active ? 0 : 1})">${item.active ? 'Скрыть' : 'Показать'}</button>
            <button onclick="deleteItem(${item.id})">Удалить</button>
          </div>` : ''}
    </div>
  `).join('');
}

const buyItem = guardClick(async function (itemId, cost) {
  try {
    const res = await api('/api/shop/purchase', { method: 'POST', body: JSON.stringify({ itemId }) });
    document.getElementById('coinBadge').textContent = `🪙 ${res.balance}`;
    mascot.say('Ура! Забирай свою награду! Родитель скоро её выдаст 🎉', 'fun');
    loadItems();
  } catch (e) {
    if (e.data?.error === 'insufficient_funds') {
      const item = cachedItems.find(i => i.id === itemId);
      mascot.say(`Ещё маловато монеток на «${item?.name || 'это'}» — заработай ещё, выполняя задания!`, 'disappointment');
    } else {
      mascot.say('Что-то пошло не так, попробуй ещё раз.', 'sadness');
    }
  }
});

// ---------------- покормить маскота (серебряные лакомства) ----------------
async function loadFeedGrid() {
  document.getElementById('feedGrid').innerHTML = loadingHtml();
  const { items } = await api('/api/shop/items');
  const treats = items.filter(i => i.currency === 'silver' && i.active);
  const { silverBalance } = await api('/api/me/coins');
  document.getElementById('silverBadge').textContent = `🥈 ${silverBalance}`;
  renderFeedGrid(treats, silverBalance);
}

function renderFeedGrid(items, balance) {
  const el = document.getElementById('feedGrid');
  if (items.length === 0) {
    el.innerHTML = '<p class="muted">Пока нет лакомств.</p>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="shop-item-card">
      <div class="shop-item-icon">${item.icon || '🍬'}</div>
      <div style="flex:1">
        <strong>${escapeHtml(item.name)}</strong>
        ${item.description ? `<div class="muted">${escapeHtml(item.description)}</div>` : ''}
        <div class="shop-item-cost">🥈 ${item.cost} · восстанавливает ${item.restoreAmount}% сытости</div>
      </div>
      <button class="submit-btn" onclick="feedMascotItem(${item.id})" ${balance < item.cost ? 'disabled' : ''}>Покормить</button>
    </div>
  `).join('');
}

const feedMascotItem = guardClick(async function (itemId) {
  try {
    const res = await api('/api/shop/purchase', { method: 'POST', body: JSON.stringify({ itemId }) });
    document.getElementById('silverBadge').textContent = `🥈 ${res.silverBalance}`;
    const pct = Math.round(res.hunger);
    document.getElementById('hungerBarFill').style.width = `${pct}%`;
    document.getElementById('hungerPercentText').textContent = `${pct}%`;
    mascot.say(pct >= 95 ? 'Ммм, объелся! Спасибо! 😋' : 'Вкуснятина, спасибо!', 'kiss');
    loadFeedGrid();
  } catch (e) {
    if (e.data?.error === 'insufficient_funds') {
      mascot.say('Маловато серебряных монеток на это лакомство — заработай ещё!', 'disappointment');
    } else {
      mascot.say('Что-то пошло не так...', 'sadness');
    }
  }
});

const toggleItemActive = guardClick(async function (itemId, active) {
  await api(`/api/shop/items/${itemId}`, { method: 'PATCH', body: JSON.stringify({ active: !!active }) });
  loadItems();
});
const deleteItem = guardClick(async function (itemId) {
  const ok = await showConfirmDialog('Товар пропадёт из витрины у всех детей.', { title: 'Удалить этот товар?', danger: true, confirmText: 'Удалить' });
  if (!ok) return;
  await api(`/api/shop/items/${itemId}`, { method: 'DELETE' });
  loadItems();
});

function openEditItemDialog(itemId) {
  const item = cachedItems.find(i => i.id === itemId);
  if (!item) return;
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `
    <div class="dialog-card" role="dialog" aria-modal="true">
      <h3>Изменить товар</h3>
      <div class="field-row">
        <label class="muted">Тип
          <select id="editCurrency">
            <option value="gold" ${item.currency !== 'silver' ? 'selected' : ''}>Награда (золотые монеты)</option>
            <option value="silver" ${item.currency === 'silver' ? 'selected' : ''}>Лакомство для маскота (серебряные монеты)</option>
          </select>
        </label>
        <label class="muted">Иконка (эмодзи)<input type="text" id="editIcon" maxlength="4" value="${escapeHtml(item.icon || '')}" /></label>
        <label class="muted">Название<input type="text" id="editName" value="${escapeHtml(item.name)}" required /></label>
        <label class="muted">Описание<input type="text" id="editDescription" value="${escapeHtml(item.description || '')}" /></label>
        <label class="muted">Цена (монет)<input type="number" id="editCost" min="1" value="${item.cost}" required /></label>
        <label class="muted" id="editRestoreWrap" style="display:${item.currency === 'silver' ? 'block' : 'none'}">
          Восстанавливает сытости, %
          <input type="number" id="editRestoreAmount" min="1" max="100" value="${item.restoreAmount || 20}" />
        </label>
        <p class="dialog-error" id="editItemError"></p>
      </div>
      <div class="dialog-actions">
        <button class="wizard-btn" id="editCancelBtn">Отмена</button>
        <button class="wizard-btn primary" id="editSaveBtn">Сохранить</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector('#editCancelBtn').onclick = close;
  overlay.querySelector('#editCurrency').onchange = (e) => {
    overlay.querySelector('#editRestoreWrap').style.display = e.target.value === 'silver' ? 'block' : 'none';
  };
  overlay.querySelector('#editSaveBtn').onclick = guardClick(async () => {
    const errEl = overlay.querySelector('#editItemError');
    const name = overlay.querySelector('#editName').value.trim();
    const description = overlay.querySelector('#editDescription').value.trim();
    const cost = Number(overlay.querySelector('#editCost').value);
    const icon = overlay.querySelector('#editIcon').value.trim() || '🎁';
    const currency = overlay.querySelector('#editCurrency').value;
    const restoreAmount = Number(overlay.querySelector('#editRestoreAmount').value);
    if (!name) { errEl.textContent = 'Название не может быть пустым.'; return; }
    if (!cost || cost <= 0) { errEl.textContent = 'Цена должна быть положительным числом.'; return; }
    if (currency === 'silver' && (!restoreAmount || restoreAmount <= 0)) {
      errEl.textContent = 'Укажите, сколько % сытости восстанавливает лакомство.'; return;
    }
    try {
      await api(`/api/shop/items/${itemId}`, {
        method: 'PATCH',
        body: JSON.stringify({ name, description, cost, icon, currency, restoreAmount }),
      });
      close();
      loadItems();
    } catch (e) {
      errEl.textContent = 'Не удалось сохранить изменения.';
    }
  });
  overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
}

guardFormSubmit(document.getElementById('addItemForm'), async (e) => {
  const resultEl = document.getElementById('addItemResult');
  const name = document.getElementById('itemName').value.trim();
  const description = document.getElementById('itemDescription').value.trim();
  const cost = Number(document.getElementById('itemCost').value);
  const icon = document.getElementById('itemIcon').value.trim() || '🎁';
  const currency = document.getElementById('itemCurrency').value;
  const restoreAmount = Number(document.getElementById('itemRestoreAmount').value);
  try {
    await api('/api/shop/items', { method: 'POST', body: JSON.stringify({ name, description, cost, icon, currency, restoreAmount }) });
    resultEl.textContent = 'Товар добавлен!';
    resultEl.style.color = 'var(--correct)';
    document.getElementById('addItemForm').reset();
    document.getElementById('itemIcon').value = '🎁';
    document.getElementById('restoreAmountWrap').style.display = 'none';
    loadItems();
  } catch (e) {
    resultEl.textContent = 'Не удалось добавить (укажите название и положительную цену).';
    resultEl.style.color = 'var(--wrong)';
  }
});

// ---------------- история покупок (ребёнок) ----------------
async function loadHistory() {
  document.getElementById('historyList').innerHTML = loadingHtml();
  const { purchases } = await api('/api/shop/purchases');
  cachedPurchases = purchases;
  const el = document.getElementById('historyList');
  if (purchases.length === 0) {
    el.innerHTML = '<p class="muted">Пока нет покупок.</p>';
    return;
  }
  const pending = purchases.filter(p => p.status === 'pending').length;
  if (pending > 0) mascot.say(`Жду, когда тебе выдадут ${pending === 1 ? 'заказ' : 'заказы'} (${pending})!`, 'boredom');
  else mascot.say('Все заказы уже получены! 🎉', 'fun');

  el.innerHTML = purchases.map(p => `
    <div class="assignment-card" style="cursor:default">
      <div style="flex:1">
        <strong>${escapeHtml(p.itemName)}</strong> · 🪙 ${p.cost}
        <div class="muted">${new Date(p.createdAt + 'Z').toLocaleString('ru-RU')}</div>
      </div>
      <span class="${p.status === 'fulfilled' ? 'given' : 'muted'}">${p.status === 'fulfilled' ? '✅ Выдано' : '⏳ Ожидает выдачи'}</span>
    </div>
  `).join('');
}

// ---------------- выдача покупок (родитель/админ) ----------------
async function loadFulfillList() {
  const el = document.getElementById('fulfillList');
  el.innerHTML = loadingHtml();
  if (!currentChildId) { el.innerHTML = '<p class="muted">Сначала добавьте ребёнка.</p>'; return; }
  const { purchases } = await api(`/api/shop/purchases?childId=${currentChildId}`);
  const pending = purchases.filter(p => p.status === 'pending');
  if (pending.length === 0) { el.innerHTML = '<p class="muted">Нет покупок, ожидающих выдачи.</p>'; return; }
  el.innerHTML = pending.map(p => `
    <div class="assignment-card" style="cursor:default">
      <div style="flex:1">
        <strong>${escapeHtml(p.itemName)}</strong> · 🪙 ${p.cost}
        <div class="muted">${new Date(p.createdAt + 'Z').toLocaleString('ru-RU')}</div>
      </div>
      <button onclick="fulfillPurchase(${p.id})">Отметить выданным</button>
    </div>
  `).join('');
}

const fulfillPurchase = guardClick(async function (purchaseId) {
  await api(`/api/shop/purchases/${purchaseId}/fulfill`, { method: 'POST' });
  loadFulfillList();
});

init();
</script>
</body>
</html>
