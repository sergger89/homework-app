<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Мои задания</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <h1 id="greeting">📚 Мои задания</h1>
    <div style="display:flex; gap:8px; align-items:center">
      <span id="coinBadge" class="coin-badge">🪙 0</span>
      <span id="silverBadge" class="silver-badge">🥈 0</span>
      <div id="topbarMenu"></div>
    </div>
  </div>
  <div class="container">
    <div id="list" class="assignment-list">
      <div class="loading-state"><span class="spinner" aria-hidden="true"></span>Загрузка...</div>
    </div>
  </div>
<script src="/js/mascot-render.js"></script>
<script src="/js/common.js"></script>
<script>
requireRole('child');

buildTopbarMenu(document.getElementById('topbarMenu'), [
  { label: 'Магазин', icon: '🛍️', onClick: () => window.location.href = '/shop.html' },
  { label: 'Книги', icon: '📚', onClick: () => window.location.href = '/books.html' },
  { label: 'Профиль', icon: '👤', onClick: () => window.location.href = '/profile.html' },
  { divider: true },
  { label: 'Выйти', icon: '🚪', onClick: () => logout(), danger: true },
]);

async function load() {
  const me = await api('/api/me');
  const mascotEl = document.createElement('img');
  mascotEl.alt = 'Маскот';
  mascotEl.className = 'mascot-mini';
  mascotEl.src = mascotSrc('joy'); // пока голод не загружен - нейтральный вид
  document.getElementById('greeting').innerHTML =
    avatarHtml(me.user.name, me.user.avatarPath, 32) + ` <span style="margin-left:8px">Привет, ${escapeHtml(me.user.name)}!</span>`;
  document.getElementById('greeting').prepend(mascotEl);
  document.getElementById('greeting').style.display = 'flex';
  document.getElementById('greeting').style.alignItems = 'center';
  preloadMascotImages();

  api('/api/me/hunger').then(({ hunger }) => {
    mascotEl.src = mascotSrc(hungerMood(hunger));
    mascotEl.title = hunger < 30 ? 'Маскот проголодался — загляни в магазин покормить его' : '';
  });

  api('/api/me/coins').then(({ balance, silverBalance }) => {
    document.getElementById('coinBadge').textContent = `🪙 ${balance}`;
    document.getElementById('silverBadge').textContent = `🥈 ${silverBalance}`;
  });

  const list = document.getElementById('list');
  list.innerHTML = loadingHtml();
  const { assignments } = await api('/api/assignments');
  list.innerHTML = '';
  if (assignments.length === 0) {
    list.innerHTML = '<p class="muted">Пока нет заданий. Загляни позже 🙂</p>';
    return;
  }
  assignments.forEach(a => {
    const pct = a.totalTasks ? Math.round(100 * a.doneTasks / a.totalTasks) : 0;
    const done = a.totalTasks > 0 && a.doneTasks === a.totalTasks;
    const div = document.createElement('div');
    div.className = 'assignment-card';
    div.onclick = () => window.location.href = `/assignment.html?id=${a.id}`;
    div.innerHTML = `
      <div style="flex:1">
        <span class="subject-badge">${subjectLabel(a.subject)}</span>
        <div><strong>${escapeHtml(a.title)}</strong></div>
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
        <div class="muted">${a.doneTasks} из ${a.totalTasks} выполнено${done ? ' ✅' : ''}</div>
        ${a.reward ? `<div class="reward-banner" style="margin-top:8px">🎁 ${escapeHtml(a.reward)}${a.rewardGiven ? ' <span class="given">(получено!)</span>' : ''}</div>` : ''}
      </div>
    `;
    list.appendChild(div);
  });
}
load();
</script>
</body>
</html>
